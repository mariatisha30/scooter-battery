#a-charging {--bg: #050607; --surface: #0C0E11; --surface-2: #121519; --line: #1A1E24;

#a-charging .ef.e {left: 72px;}
#a-charging .ef.f {right: 72px;}

#a-charging .seg button.on {background: var(--surface-2); color: var(--text);}

#a-charging .eta b {color: var(--text); font-weight: 600;}

#a-charging .legend b {color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums;}

#a-charging .tile {background: var(--surface); border-radius: 16px; padding: 12px;}

#a-charging .spark {width: 100%; height: 64px; margin-top: 10px; display: block;}

#a-charging .tabbar a {flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--dim);}
#a-charging .tabbar a i {font-size: 24px;}
#a-charging .tabbar a.on {color: var(--lime);}

#b-charging .icon-btn {width: 40px; height: 40px; border-radius: 14px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); display: grid; place-items: center; color: var(--muted); font-size: 19px; border: 0;}
